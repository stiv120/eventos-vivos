<section class="card">
  <h2>Crear evento</h2>

  @if (successMessage) {
    <p class="alert success">{{ successMessage }}</p>
  }
  @if (errorMessage) {
    <p class="alert error">{{ errorMessage }}</p>
  }

  <form [formGroup]="form" (ngSubmit)="submit()">
    <label>
      Título
      <input formControlName="title" type="text" />
      @if (form.controls.title.touched && form.controls.title.invalid) {
        <span class="field-error">El título debe tener entre 5 y 100 caracteres.</span>
      }
    </label>

    <label>
      Descripción
      <textarea formControlName="description" rows="3"></textarea>
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <span class="field-error">La descripción debe tener entre 10 y 500 caracteres.</span>
      }
    </label>

    <label>
      Venue
      <select formControlName="venueId">
        <option [ngValue]="null">Seleccione un venue</option>
        @for (venue of venues; track venue.id) {
          <option [ngValue]="venue.id">{{ venue.name }} ({{ venue.city }}) - Cap: {{ venue.capacity }}</option>
        }
      </select>
    </label>

    @if (selectedVenue) {
      <p class="hint">Capacidad máxima del venue: {{ selectedVenue.capacity }}</p>
    }

    <label>
      Capacidad máxima
      <input formControlName="maxCapacity" type="number" min="1" />
    </label>

    <label>
      Fecha y hora de inicio
      <input formControlName="startDateTime" type="datetime-local" />
    </label>

    <label>
      Fecha y hora de fin
      <input formControlName="endDateTime" type="datetime-local" />
    </label>

    <label>
      Precio de entrada
      <input formControlName="ticketPrice" type="number" min="0.01" step="0.01" />
    </label>

    <label>
      Tipo de evento
      <select formControlName="type">
        @for (type of eventTypes; track type.value) {
          <option [ngValue]="type.value">{{ type.label }}</option>
        }
      </select>
    </label>

    <button type="submit" [disabled]="isSubmitting || form.invalid">
      {{ isSubmitting ? 'Creando...' : 'Crear evento' }}
    </button>
  </form>
</section>
