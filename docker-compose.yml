name: eventos-vivos

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: eventos-vivos-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:-EventosVivos_Dev123!}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" -b -o /dev/null || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: eventos-vivos-api
    environment:
      ASPNETCORE_ENVIRONMENT: Docker
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: Server=sqlserver,1433;Database=EventosVivos;User Id=sa;Password=${MSSQL_SA_PASSWORD:-EventosVivos_Dev123!};TrustServerCertificate=True;Encrypt=False
      Admin__ApiKey: ${ADMIN_API_KEY:-dev-admin-key}
    ports:
      - "5142:8080"
    depends_on:
      sqlserver:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        ADMIN_API_KEY: ${ADMIN_API_KEY:-dev-admin-key}
    container_name: eventos-vivos-ui
    ports:
      - "4200:80"
    depends_on:
      - api

volumes:
  sqlserver_data:
